<text x="92" y="352" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#52514e">Frameworks and visual tools to build agents.</text>
<text x="1108" y="328" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1baf7a">16</text>
