name: market-map

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/market_map.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate market map
        run: python3 scripts/market_map.py README.md media/market-map.svg
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain media)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add media/market-map.svg
            git commit -m "Regenerate market map"
            git push
          else
            echo "Map unchanged"
          fi
