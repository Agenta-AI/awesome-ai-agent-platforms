name: market-map

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/market_map.py
      - scripts/social_preview.py
      - scripts/tile_contrast.py
      - scripts/article_images.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
          python3 -m pip install --quiet pillow
      - name: Generate market map
        run: python3 scripts/market_map.py README.md media/market-map.svg
      - name: Generate social preview
        run: |
          python3 scripts/social_preview.py README.md media/social-preview.svg
          rsvg-convert -w 1280 -h 640 media/social-preview.svg -o media/social-preview.png
      - name: Generate article images
        run: |
          python3 scripts/article_images.py
          rsvg-convert -w 3200 -h 1360 media/article-cover.svg -o media/article-cover.png
          rsvg-convert -w 2400 -h 1520 media/categories.svg -o media/categories.png
          rsvg-convert -w 2880 media/market-map.svg -o media/market-map.png
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain media)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add media/
            git commit -m "Regenerate media (map, social preview, article images)"
            git push
          else
            echo "Media unchanged"
          fi
